name: environment-checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.12'
          - os: windows-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
  engine-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python scripts/bootstrap.py --source-only
      - run: dotnet build external/CA-VAL-AIM/CaValAim/CaValAim.csproj --nologo
      # This job checks compilation only. It does not unpack the bundled map
      # or perform real-map rendering; run smoke separately for that check.
