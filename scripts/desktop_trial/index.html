<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>选关开始 · 云端实时试玩</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d151c;color:#edf4fa;font:16px/1.65 system-ui}main{max-width:1450px;margin:auto;padding:28px}h1{font-size:30px;margin:5px 0}p{color:#b3c5d3;margin:8px 0 22px}.tag{color:#69e4bc;font-size:13px;letter-spacing:2px}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px}aside{padding:24px;background:#17232e;border:1px solid #2c3e4d;border-radius:14px}label{display:block;font-weight:700;margin-bottom:10px}select,button{font:inherit;border-radius:7px;padding:12px;border:1px solid #344a5a}select{width:100%;color:#edf4fa;background:#101c26}button{background:#6be3b8;color:#102820;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:wait}.secondary{color:#d7e5ee;background:#15232e}#start{width:100%;margin:18px 0 12px}#hint{font-size:14px;min-height:120px;margin:16px 0}.keys{border-top:1px solid #344a5a;padding-top:16px;font-size:14px;color:#b3c5d3}kbd{background:#314451;padding:2px 6px;border-radius:3px;color:white}.stage{position:relative;aspect-ratio:16/9;background:#080f15;border:1px solid #2c3e4d;border-radius:14px;overflow:hidden}#screen{width:100%;height:100%}#cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#101c26;padding:28px;z-index:2}#cover.hidden{display:none}#cover h2{font-size:26px;margin:8px}#cover p{max-width:420px;margin:10px auto}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0}#status{color:#8ef0c9;padding:16px;background:#17232e;border-radius:10px}.note{font-size:13px;color:#95aebe}.playing aside{opacity:.7}@media(max-width:900px){main{padding:16px}.layout{grid-template-columns:1fr}#hint{min-height:0}aside{padding:16px}}
</style>
<main><div class="tag">中文选关 · 实时试玩</div><h1>选一关，直接开始。</h1><p>不用进入游戏首页。开始后鼠标控制视角；按 Esc 返回这里选关。</p>
<div class="layout"><aside><label for="course">选择关卡</label><select id="course" disabled><option>正在加载关卡…</option></select><p id="hint"></p><button id="start" disabled>开始这一关</button><div class="keys"><b>操作说明</b><p><kbd>W A S D</kbd> 移动<br>鼠标转视角 · 左键开枪<br><kbd>R</kbd> 换弹 · <kbd>空格</kbd> 跳跃<br><kbd>Shift</kbd> 慢走 · <kbd>Ctrl</kbd> 蹲下<br><kbd>Esc</kbd> 结束本次，返回选关</p></div><span class="note">目前是试玩入口，不保存训练示范。</span></aside>
<section><div class="stage"><div id="screen"></div><div id="cover"><div><div class="tag">准备开始</div><h2 id="coverTitle">先选关，再点开始</h2><p id="coverText">场景会自动打开，不需要在英文菜单里找按钮。</p></div></div></div><div class="toolbar"><button id="again" class="secondary" disabled>重新开始本关</button><button id="back" class="secondary" disabled>返回选关</button><button id="full" class="secondary">全屏</button></div><div id="status" role="status">正在连接…</div><p class="note">若出现英文结算画面，按 Esc 返回，然后点“开始这一关”即可重玩。开始前与退出后，鼠标都可以正常点击网页。</p></section></div></main>
<script type="module">
import RFB from '/novnc/core/rfb.js';
const $=id=>document.getElementById(id),screen=$('screen'),status=$('status');
const start=$('start'),course=$('course');
const rfb=new RFB(screen,`${location.protocol==='https:'?'wss':'ws'}://${location.host}/rfb`,{shared:true});
rfb.scaleViewport=true;rfb.viewOnly=true;
const socket=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/input`);
let video=false,ready=false,active=false,loading=false,playing=false,mx=0,my=0,lockAt=0,catalog=[];
const allowed=new Set(['KeyW','KeyA','KeyS','KeyD','KeyR','KeyQ','KeyE','KeyF','Space','ShiftLeft','ControlLeft','Digit1','Digit2','Digit3','Tab']);
function send(data){if(socket.readyState===WebSocket.OPEN)socket.send(JSON.stringify(data));}
function controls(){start.disabled=!(ready&&video&&catalog.length)||loading||playing;course.disabled=loading||playing||!catalog.length;$('again').disabled=!(ready&&video)||loading;$('back').disabled=!(loading||playing);}
function cover(title,text){$('coverTitle').textContent=title;$('coverText').textContent=text;$('cover').classList.remove('hidden');}
function release(){active=false;mx=my=0;send({type:'release'});rfb.viewOnly=true;}
function end(message='已返回选关，可以重新开始。'){
 const wasRunning=loading||playing;loading=playing=false;release();
 if(wasRunning)send({type:'stop'});
 if(document.pointerLockElement)document.exitPointerLock();
 document.body.classList.remove('playing');cover('选择关卡，随时再来','鼠标已恢复，可以点击左侧选关和开始按钮。');status.textContent=message;controls();
}
rfb.addEventListener('connect',()=>{video=true;if(ready)status.textContent='已连接，选择关卡后点“开始这一关”。';controls();});
rfb.addEventListener('disconnect',()=>{video=false;end('画面连接断开，请刷新页面。');});
socket.addEventListener('message',e=>{const data=JSON.parse(e.data);
 if(data.ready){ready=true;status.textContent=video?'已连接，选择关卡后点“开始这一关”。':'控制已连接，正在连接画面…';}
 if(data.launched){if(!loading||document.pointerLockElement!==screen){send({type:'stop'});return;}loading=false;playing=true;active=true;mx=my=0;lockAt=performance.now();$('cover').classList.add('hidden');status.textContent='正在试玩 · WASD 移动，鼠标瞄准，左键开枪；Esc 返回选关。';document.body.classList.add('playing');}
 if(data.error)end(data.error);
 controls();
});
socket.addEventListener('close',()=>{ready=false;end('控制连接断开或另一个试玩页面正在使用。请关闭其他试玩页面后刷新。');});
setInterval(()=>send({type:'ping'}),500);
async function begin(){
 if(!(ready&&video)||loading)return;
 loading=true;playing=false;release();controls();cover('正在加载关卡…','稍等片刻，场景会自动进入。按 Esc 可取消。');
 try{await screen.requestPointerLock();if(document.pointerLockElement!==screen)throw Error('未锁定');send({type:'start',course:course.value});}
 catch{end('未能锁定鼠标，请再次点击“开始这一关”。');}
}
start.onclick=$('again').onclick=begin;$('back').onclick=()=>end();
document.addEventListener('pointerlockchange',()=>{if(document.pointerLockElement!==screen)end();});
document.addEventListener('pointerlockerror',()=>end('鼠标锁定失败，请再次点击开始。'));
$('full').onclick=()=>document.documentElement.requestFullscreen().catch(()=>status.textContent='无法全屏，可直接在窗口中试玩。');
document.addEventListener('mousemove',e=>{if(active&&document.pointerLockElement===screen&&performance.now()-lockAt>=100){const x=e.movementX,y=e.movementY;if(!Number.isFinite(x)||!Number.isFinite(y)||Math.abs(x)>512||Math.abs(y)>512){mx=my=0;return;}mx+=x;my+=y;}});
setInterval(()=>{if(active&&(mx||my)){send({type:'move',dx:Math.max(-1000,Math.min(1000,Math.round(mx))),dy:Math.max(-1000,Math.min(1000,Math.round(my)))});mx=my=0;}},16);
document.addEventListener('keydown',e=>{if(active&&allowed.has(e.code)){e.preventDefault();if(!e.repeat)send({type:'key',key:e.code,down:true});}});
document.addEventListener('keyup',e=>{if(allowed.has(e.code))send({type:'key',key:e.code,down:false});});
document.addEventListener('mousedown',e=>{if(active&&[0,2].includes(e.button)){e.preventDefault();send({type:'button',button:e.button===0?1:3,down:true});}},true);
document.addEventListener('mouseup',e=>{if([0,2].includes(e.button))send({type:'button',button:e.button===0?1:3,down:false});},true);
screen.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('blur',()=>{if(loading||playing)end('已切出窗口，本次试玩结束。点开始可重新进入。');});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(loading||playing))end();});
window.addEventListener('pagehide',()=>{send({type:'stop'});send({type:'release'});socket.close();rfb.disconnect();});
course.onchange=()=>{$('hint').textContent=catalog.find(c=>c.id===course.value)?.hint||'';};
fetch('/courses').then(r=>{if(!r.ok)throw Error();return r.json();}).then(items=>{catalog=items;course.replaceChildren(...items.map(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.title;return o;}));course.onchange();controls();}).catch(()=>status.textContent='关卡列表加载失败，请刷新。');
</script></html>
